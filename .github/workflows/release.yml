name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
          - os: macos-latest
            artifact: darwin-arm64
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            artifact: darwin-amd64
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config clang libclang-dev
      - name: macOS bindgen target
        if: runner.os == 'macOS'
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_darwin=--target=aarch64-apple-darwin" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_apple_darwin=--target=x86_64-apple-darwin" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.rust-target }}
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          name="spar-${GITHUB_REF_NAME}-${{ matrix.artifact }}"
          mkdir "$name"
          cp "target/${{ matrix.rust-target }}/release/spar" "$name/spar"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            spar-*.tar.gz
            spar-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/spar-*.tar.gz dist/spar-*.tar.gz.sha256 \
            --generate-notes --repo "${GITHUB_REPOSITORY}" \
            || gh release upload "${GITHUB_REF_NAME}" dist/spar-*.tar.gz dist/spar-*.tar.gz.sha256 --clobber --repo "${GITHUB_REPOSITORY}"
